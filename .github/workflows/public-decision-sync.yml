name: Sync success-only public decision

on:
  push:
    branches: [main]
    paths:
      - "site/data/trading-data.json"
      - "site/data/short-term-formal-backtest-readiness.json"
      - "site/data/short-term-qqq-replacement-overlay.json"
      - "scripts/build_public_decision_data.py"
      - "usfddk/site_export.py"
      - ".github/workflows/public-decision-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-decision-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research runtime
        run: uv sync --locked --extra dev
      - name: Build the success-only public decision contract
        run: ./.venv/bin/python scripts/build_public_decision_data.py
      - name: Verify the public contract
        run: |
          ./.venv/bin/pytest -q tests/test_site_export.py
          git diff --check
      - name: Commit only a changed public contract
        run: |
          if git diff --quiet -- site/data/public-decision.json; then
            echo "Public decision surface is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/data/public-decision.json
          git diff --cached --check
          git commit -m "Sync success-only public decision"
          git push origin HEAD:main

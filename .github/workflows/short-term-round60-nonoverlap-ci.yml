name: Short-term Round60 non-overlap capital accounting CI

on:
  pull_request:
    paths:
      - ".github/workflows/short-term-round60-nonoverlap-ci.yml"
      - "docs/SHORT_TERM_LAGGARD_REVERSAL_NONOVERLAP_PROTOCOL.md"
      - "docs/SHORT_TERM_LAGGARD_REVERSAL_NONOVERLAP_REPORT.md"
      - "artifacts/short_term_laggard_reversal_nonoverlap_protocol_receipt.json"
      - "artifacts/short_term_laggard_reversal_nonoverlap_validation.json"
      - "artifacts/short_term_global_trial_ledger_round60_extension.json"
      - "scripts/audit_short_term_laggard_reversal_nonoverlap.py"
      - "tests/test_laggard_reversal_nonoverlap.py"
      - "usfddk/global_trial_ledger_round60_extension.py"
      - "usfddk/short_term_laggard_reversal_nonoverlap.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify the frozen Round60 capital-accounting contract
        env:
          PYTHONHASHSEED: "0"
        run: |
          uv sync --locked --extra dev
          uv run pytest -q tests/test_laggard_reversal_nonoverlap.py
          uv run ruff check \
            usfddk/short_term_laggard_reversal_nonoverlap.py \
            usfddk/global_trial_ledger_round60_extension.py \
            scripts/audit_short_term_laggard_reversal_nonoverlap.py \
            tests/test_laggard_reversal_nonoverlap.py
          git diff --check

name: Short-term Round51 breakout diagnostic CI

on:
  pull_request:
    paths:
      - ".github/workflows/short-term-round51-breakout-ci.yml"
      - "docs/SHORT_TERM_CURRENT_COHORT_BREAKOUT_DIAGNOSTIC_PROTOCOL.md"
      - "artifacts/short_term_current_cohort_breakout_protocol_receipt.json"
      - "artifacts/short_term_current_cohort_breakout_validation.json"
      - "scripts/audit_short_term_current_cohort_breakout.py"
      - "tests/test_current_cohort_breakout.py"
      - "usfddk/short_term_current_cohort_breakout.py"
      - "usfddk/short_term_high_return.py"
      - "artifacts/short_term_global_trial_ledger.json"
      - "docs/SHORT_TERM_GLOBAL_TRIAL_LEDGER_PROTOCOL.md"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify the frozen Round51 diagnostic contract
        env:
          PYTHONHASHSEED: "0"
        run: |
          uv sync --locked --extra dev
          uv run pytest -q tests/test_current_cohort_breakout.py
          uv run ruff check \
            usfddk/short_term_current_cohort_breakout.py \
            scripts/audit_short_term_current_cohort_breakout.py \
            tests/test_current_cohort_breakout.py
          git diff --check

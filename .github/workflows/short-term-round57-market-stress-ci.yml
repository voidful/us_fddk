name: Short-term Round57 market stress laggard reversal CI

on:
  pull_request:
    paths:
      - ".github/workflows/short-term-round57-market-stress-ci.yml"
      - "docs/SHORT_TERM_MARKET_STRESS_LAGGARD_REVERSAL_PROTOCOL.md"
      - "docs/SHORT_TERM_MARKET_STRESS_LAGGARD_REVERSAL_REPORT.md"
      - "artifacts/short_term_market_stress_laggard_reversal_protocol_receipt.json"
      - "artifacts/short_term_market_stress_laggard_reversal_validation.json"
      - "artifacts/short_term_global_trial_ledger_round57_extension.json"
      - "scripts/audit_short_term_market_stress_laggard_reversal.py"
      - "tests/test_market_stress_laggard_reversal.py"
      - "usfddk/global_trial_ledger_round57_extension.py"
      - "usfddk/short_term_market_stress_laggard_reversal.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify the frozen Round57 market-stress contract
        env:
          PYTHONHASHSEED: "0"
        run: |
          uv sync --locked --extra dev
          uv run pytest -q tests/test_market_stress_laggard_reversal.py
          uv run ruff check \
            usfddk/short_term_market_stress_laggard_reversal.py \
            usfddk/global_trial_ledger_round57_extension.py \
            scripts/audit_short_term_market_stress_laggard_reversal.py \
            tests/test_market_stress_laggard_reversal.py
          git diff --check

name: Form 4 Round50 current-cohort coverage CI

on:
  pull_request:
    paths:
      - ".github/workflows/form4-round50-current-cohort-ci.yml"
      - "docs/SHORT_TERM_FORM4_CURRENT_COHORT_COVERAGE_*.md"
      - "artifacts/short_term_form4_current_cohort_coverage_*.json"
      - "scripts/audit_short_term_form4_current_cohort_coverage.py"
      - "usfddk/form4_current_cohort_coverage.py"
      - "tests/test_form4_current_cohort_coverage.py"
      - "usfddk/form4_historical_feasibility.py"
      - "artifacts/short_term_form4_historical_feasibility_*.json"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify aggregate-only current-cohort contract
        env:
          PYTHONHASHSEED: "0"
        run: |
          uv sync --locked --extra dev
          uv run pytest -q tests/test_form4_current_cohort_coverage.py
          uv run ruff check \
            usfddk/form4_current_cohort_coverage.py \
            scripts/audit_short_term_form4_current_cohort_coverage.py \
            tests/test_form4_current_cohort_coverage.py
          git diff --check

name: Daily v25 Paper update

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-v25-paper-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research runtime
        run: python -m pip install -e '.[dev]'
      - name: Fetch the latest completed U.S. session
        run: python -m usfddk v25-live-update
      - name: Export only the frozen v25 LIVE contract
        run: python -m usfddk v25-site-export
      - name: Audit website and append the evidence chain
        run: |
          python -m usfddk v25-reference-check --receipt-ledger ""
          if [ "$(jq -r '.data_advanced' artifacts/v25_live_update_status.json)" = "true" ]; then
            python -m usfddk v25-reference-check
          else
            echo "No new U.S. session; the formal append-only ledger remains untouched."
          fi
          python -m usfddk v25-refresh-status
      - name: Verify research code
        run: |
          python scripts/build_short_term_french_prior_return_schema_repair_report.py
          python scripts/build_short_term_french_size_prior_report.py
          python scripts/build_short_term_french_size_momentum_tilt_report.py
          python scripts/audit_short_term_point_in_time_data.py
          python scripts/build_short_term_provider_qualification_report.py
          python scripts/build_short_term_crsp_sample_acceptance_report.py
          python scripts/build_short_term_crsp_ciz_mapping_report.py
          python scripts/build_short_term_ciz_execution_accounting_report.py
          python scripts/build_short_term_ciz_execution_extension_report.py
          python scripts/build_short_term_authorized_data_handoff_report.py
          python scripts/build_short_term_daily_momentum_regime_report.py
          git diff --exit-code -- \
            artifacts/short_term_french_prior_return_schema_repair_validation.json \
            site/data/short-term-french-prior-return-schema-repair.json \
            artifacts/short_term_french_size_prior_validation.json \
            site/data/short-term-french-size-prior.json \
            docs/SHORT_TERM_FRENCH_SIZE_PRIOR_RESEARCH_REPORT.md \
            artifacts/short_term_french_size_momentum_tilt_validation.json \
            site/data/short-term-french-size-momentum-tilt.json \
            docs/SHORT_TERM_FRENCH_SIZE_MOMENTUM_TILT_RESEARCH_REPORT.md \
            artifacts/short_term_point_in_time_readiness.json \
            site/data/short-term-point-in-time-readiness.json \
            artifacts/short_term_provider_qualification.json \
            site/data/short-term-provider-qualification.json \
            docs/SHORT_TERM_PROVIDER_QUALIFICATION_REPORT.md \
            artifacts/short_term_crsp_sample_acceptance.json \
            site/data/short-term-crsp-sample-acceptance.json \
            docs/SHORT_TERM_CRSP_SAMPLE_ACCEPTANCE_REPORT.md \
            artifacts/short_term_crsp_ciz_mapping_validation.json \
            site/data/short-term-crsp-ciz-mapping.json \
            docs/SHORT_TERM_CRSP_CIZ_MAPPING_REPORT.md \
            artifacts/short_term_ciz_execution_accounting_validation.json \
            site/data/short-term-ciz-execution-accounting.json \
            docs/SHORT_TERM_CIZ_EXECUTION_ACCOUNTING_REPORT.md \
            artifacts/short_term_ciz_execution_extension_validation.json \
            site/data/short-term-ciz-execution-extension.json \
            docs/SHORT_TERM_CIZ_EXECUTION_EXTENSION_REPORT.md \
            artifacts/short_term_authorized_data_handoff.json \
            site/data/short-term-authorized-data-handoff.json \
            docs/SHORT_TERM_AUTHORIZED_DATA_HANDOFF.md \
            artifacts/short_term_daily_momentum_regime_validation.json \
            site/data/short-term-daily-momentum-regime.json \
            docs/SHORT_TERM_DAILY_MOMENTUM_REGIME_RESEARCH_REPORT.md
          ruff check usfddk tests
          pytest tests/test_french_prior_return_research.py
          pytest tests/test_french_size_prior.py
          pytest tests/test_french_size_momentum_tilt.py
          pytest tests/test_point_in_time_ledger.py
          pytest tests/test_provider_qualification.py
          pytest tests/test_crsp_sample_acceptance.py
          pytest tests/test_crsp_ciz_mapping.py
          pytest tests/test_ciz_execution_accounting.py
          pytest tests/test_ciz_execution_extension.py
          pytest tests/test_authorized_data_handoff.py
          pytest tests/test_daily_momentum_regime.py
          pytest tests/test_site_export.py
          pytest tests/test_v25_live.py -k audit
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify website
        working-directory: site
        run: |
          npm ci
          npm run lint
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit a genuinely advanced session
        id: commit_update
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.public_paper_status_deploy_allowed' artifacts/v25_live_refresh_status.json)" != "true" ]; then
            echo "No verified new U.S. session; leaving the published evidence unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/paper_v25_state.json \
            artifacts/paper_v25_spy_state.json \
            artifacts/paper_v25_matched_state.json \
            artifacts/site_data.json \
            artifacts/v25_forward_paper_evidence.json \
            artifacts/v25_live_evidence_ledger.jsonl \
            artifacts/v25_live_refresh_status.json \
            artifacts/v25_live_update_status.json \
            artifacts/v25_reference_readiness.json \
            site/data/trading-data.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Verified session is already recorded."
            exit 0
          fi
          data_through="$(jq -r '.data_through' artifacts/v25_live_refresh_status.json)"
          git commit -m "Update v25 Paper through ${data_through}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy a genuinely advanced session
        if: steps.commit_update.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

name: Daily v25 Paper update

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-v25-paper-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research runtime
        run: |
          uv sync --locked --extra dev
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Probe the current official risk-free source
        run: |
          if curl --fail --location --silent --show-error \
              'https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_Factors_daily_CSV.zip' \
              --output "$RUNNER_TEMP/fama-french-daily-factors.zip"; then
            if ! ./.venv/bin/python scripts/probe_short_term_risk_free_source.py \
                --source "$RUNNER_TEMP/fama-french-daily-factors.zip"; then
              echo "Official RF source changed in an unqualified way; preserving the last verified probe and continuing the separate Paper refresh." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Official RF source was temporarily unavailable; preserving the last verified probe without blocking the separate Paper refresh." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Probe the current official CRSP guide identities
        run: |
          if ! ./.venv/bin/python scripts/probe_short_term_provider_guides.py; then
            echo "Official CRSP guide probe was unavailable or changed unexpectedly; preserving the last verified probe without blocking the separate Paper refresh." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Probe the five current official provider source identities
        run: |
          if ! ./.venv/bin/python scripts/probe_short_term_provider_gap_sources.py; then
            echo "One or more official provider source identities were unavailable or changed; preserving the last verified probe without qualifying any source." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fetch the latest completed U.S. session
        run: ./.venv/bin/python -m usfddk v25-live-update
      - name: Export only the frozen v25 LIVE contract
        run: ./.venv/bin/python -m usfddk v25-site-export
      - name: Audit website and append the evidence chain
        run: |
          ./.venv/bin/python -m usfddk v25-reference-check --receipt-ledger ""
          if [ "$(jq -r '.data_advanced' artifacts/v25_live_update_status.json)" = "true" ]; then
            ./.venv/bin/python -m usfddk v25-reference-check
          else
            echo "No new U.S. session; the formal append-only ledger remains untouched."
          fi
          ./.venv/bin/python -m usfddk v25-refresh-status
      - name: Verify research code
        env:
          OPENBLAS_CORETYPE: "HASWELL"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          ./.venv/bin/pytest tests/test_ci_runtime_contract.py
          ./.venv/bin/python scripts/build_short_term_french_prior_return_schema_repair_report.py
          ./.venv/bin/python scripts/build_short_term_french_size_prior_report.py
          ./.venv/bin/python scripts/build_short_term_french_size_momentum_tilt_report.py
          ./.venv/bin/python scripts/audit_short_term_point_in_time_data.py
          ./.venv/bin/python scripts/build_short_term_provider_qualification_report.py
          ./.venv/bin/python scripts/build_short_term_crsp_sample_acceptance_report.py
          ./.venv/bin/python scripts/build_short_term_crsp_ciz_mapping_report.py
          ./.venv/bin/python scripts/build_short_term_ciz_execution_accounting_report.py
          ./.venv/bin/python scripts/build_short_term_ciz_execution_extension_report.py
          ./.venv/bin/python scripts/build_short_term_authorized_data_handoff_report.py
          ./.venv/bin/python scripts/build_short_term_local_quarantine_intake_report.py
          ./.venv/bin/python scripts/build_short_term_formal_backtest_readiness_report.py
          ./.venv/bin/python scripts/build_short_term_restatement_firewall.py
          ./.venv/bin/python scripts/build_short_term_formal_release_integration.py
          ./.venv/bin/python scripts/build_short_term_risk_free_staging_report.py
          ./.venv/bin/python scripts/build_short_term_provider_convergence_report.py
          ./.venv/bin/python scripts/build_short_term_provider_gap_closure_report.py
          ./.venv/bin/python scripts/build_short_term_provider_evidence_refresh_report.py
          ./.venv/bin/python scripts/build_short_term_rf_treasury_bridge_report.py
          ./.venv/bin/python scripts/build_short_term_survivorship_contamination_report.py
          ./.venv/bin/python scripts/build_short_term_temporal_tail_robustness_report.py
          ./.venv/bin/python scripts/build_short_term_baseline_multiplicity_report.py
          ./.venv/bin/python scripts/build_short_term_correlation_crowding_report.py
          ./.venv/bin/python scripts/build_short_term_common_risk_residual_report.py
          ./.venv/bin/python scripts/build_short_term_rank_monotonicity_placebo_report.py
          ./.venv/bin/python scripts/build_short_term_disclosure_readiness_report.py
          ./.venv/bin/python scripts/build_short_term_multi_window_resonance_report.py
          ./.venv/bin/python scripts/build_short_term_qqq_replacement_overlay_report.py
          ./.venv/bin/python scripts/build_short_term_calendar_capital_accounting_report.py
          ./.venv/bin/python scripts/build_short_term_reversal_volatility_attribution_report.py
          ./.venv/bin/python scripts/build_short_term_daily_momentum_regime_report.py
          git diff --exit-code -- \
            artifacts/short_term_french_prior_return_schema_repair_validation.json \
            site/data/short-term-french-prior-return-schema-repair.json \
            artifacts/short_term_french_size_prior_validation.json \
            site/data/short-term-french-size-prior.json \
            docs/SHORT_TERM_FRENCH_SIZE_PRIOR_RESEARCH_REPORT.md \
            artifacts/short_term_french_size_momentum_tilt_validation.json \
            site/data/short-term-french-size-momentum-tilt.json \
            docs/SHORT_TERM_FRENCH_SIZE_MOMENTUM_TILT_RESEARCH_REPORT.md \
            artifacts/short_term_point_in_time_readiness.json \
            site/data/short-term-point-in-time-readiness.json \
            artifacts/short_term_provider_qualification.json \
            site/data/short-term-provider-qualification.json \
            docs/SHORT_TERM_PROVIDER_QUALIFICATION_REPORT.md \
            artifacts/short_term_crsp_sample_acceptance.json \
            site/data/short-term-crsp-sample-acceptance.json \
            docs/SHORT_TERM_CRSP_SAMPLE_ACCEPTANCE_REPORT.md \
            artifacts/short_term_crsp_ciz_mapping_validation.json \
            site/data/short-term-crsp-ciz-mapping.json \
            docs/SHORT_TERM_CRSP_CIZ_MAPPING_REPORT.md \
            artifacts/short_term_ciz_execution_accounting_validation.json \
            site/data/short-term-ciz-execution-accounting.json \
            docs/SHORT_TERM_CIZ_EXECUTION_ACCOUNTING_REPORT.md \
            artifacts/short_term_ciz_execution_extension_validation.json \
            site/data/short-term-ciz-execution-extension.json \
            docs/SHORT_TERM_CIZ_EXECUTION_EXTENSION_REPORT.md \
            artifacts/short_term_authorized_data_handoff.json \
            site/data/short-term-authorized-data-handoff.json \
            docs/SHORT_TERM_AUTHORIZED_DATA_HANDOFF.md \
            artifacts/short_term_local_quarantine_intake_validation.json \
            site/data/short-term-local-quarantine-intake.json \
            docs/SHORT_TERM_LOCAL_QUARANTINE_INTAKE_REPORT.md \
            artifacts/short_term_formal_backtest_readiness_validation.json \
            site/data/short-term-formal-backtest-readiness.json \
            docs/SHORT_TERM_FORMAL_BACKTEST_READINESS_REPORT.md \
            artifacts/short_term_restatement_firewall_validation.json \
            site/data/short-term-restatement-firewall.json \
            docs/SHORT_TERM_RESTATEMENT_FIREWALL_PROTOCOL.md \
            artifacts/short_term_formal_release_integration_validation.json \
            site/data/short-term-formal-release-integration.json \
            docs/SHORT_TERM_FORMAL_RELEASE_INTEGRATION_PROTOCOL.md \
            artifacts/short_term_risk_free_staging_validation.json \
            site/data/short-term-risk-free-staging.json \
            docs/SHORT_TERM_RISK_FREE_STAGING_REPORT.md \
            artifacts/short_term_provider_convergence_validation.json \
            site/data/short-term-provider-convergence.json \
            docs/SHORT_TERM_PROVIDER_CONVERGENCE_REPORT.md \
            artifacts/short_term_provider_gap_closure_validation.json \
            site/data/short-term-provider-gap-closure.json \
            docs/SHORT_TERM_PROVIDER_GAP_CLOSURE_REPORT.md \
            artifacts/short_term_provider_evidence_refresh.json \
            site/data/short-term-provider-evidence-refresh.json \
            docs/SHORT_TERM_PROVIDER_EVIDENCE_REFRESH_REPORT.md \
            artifacts/short_term_rf_treasury_bridge.json \
            site/data/short-term-rf-treasury-bridge.json \
            docs/SHORT_TERM_RF_TREASURY_BRIDGE_REPORT.md \
            artifacts/short_term_survivorship_contamination_validation.json \
            site/data/short-term-survivorship-contamination.json \
            docs/SHORT_TERM_SURVIVORSHIP_CONTAMINATION_RESEARCH_REPORT.md \
            artifacts/short_term_temporal_tail_robustness_validation.json \
            site/data/short-term-temporal-tail-robustness.json \
            docs/SHORT_TERM_TEMPORAL_TAIL_ROBUSTNESS_RESEARCH_REPORT.md \
            artifacts/short_term_baseline_multiplicity_validation.json \
            site/data/short-term-baseline-multiplicity.json \
            docs/SHORT_TERM_BASELINE_MULTIPLICITY_RESEARCH_REPORT.md \
            artifacts/short_term_correlation_crowding_validation.json \
            site/data/short-term-correlation-crowding.json \
            docs/SHORT_TERM_CORRELATION_CROWDING_RESEARCH_REPORT.md \
            artifacts/short_term_common_risk_residual_validation.json \
            site/data/short-term-common-risk-residual.json \
            docs/SHORT_TERM_COMMON_RISK_RESIDUAL_RESEARCH_REPORT.md \
            artifacts/short_term_rank_monotonicity_placebo_validation.json \
            site/data/short-term-rank-monotonicity-placebo.json \
            docs/SHORT_TERM_RANK_MONOTONICITY_PLACEBO_RESEARCH_REPORT.md \
            artifacts/short_term_disclosure_readiness.json \
            site/data/short-term-disclosure-readiness.json \
            docs/SHORT_TERM_DISCLOSURE_READINESS_REPORT.md \
            artifacts/short_term_multi_window_resonance_validation.json \
            site/data/short-term-multi-window-resonance.json \
            docs/SHORT_TERM_MULTI_WINDOW_RESONANCE_RESEARCH_REPORT.md \
            artifacts/short_term_qqq_replacement_overlay_validation.json \
            site/data/short-term-qqq-replacement-overlay.json \
            docs/SHORT_TERM_QQQ_REPLACEMENT_OVERLAY_RESEARCH_REPORT.md \
            artifacts/short_term_calendar_capital_accounting_validation.json \
            site/data/short-term-calendar-capital-accounting.json \
            docs/SHORT_TERM_CALENDAR_CAPITAL_ACCOUNTING_RESEARCH_REPORT.md \
            artifacts/short_term_reversal_volatility_attribution_validation.json \
            site/data/short-term-reversal-volatility-attribution.json \
            docs/SHORT_TERM_REVERSAL_VOLATILITY_ATTRIBUTION_RESEARCH_REPORT.md \
            artifacts/short_term_daily_momentum_regime_validation.json \
            site/data/short-term-daily-momentum-regime.json \
            docs/SHORT_TERM_DAILY_MOMENTUM_REGIME_RESEARCH_REPORT.md
          ./.venv/bin/ruff check usfddk tests
          ./.venv/bin/pytest tests/test_french_prior_return_research.py
          ./.venv/bin/pytest tests/test_french_size_prior.py
          ./.venv/bin/pytest tests/test_french_size_momentum_tilt.py
          ./.venv/bin/pytest tests/test_point_in_time_ledger.py
          ./.venv/bin/pytest tests/test_provider_qualification.py
          ./.venv/bin/pytest tests/test_crsp_sample_acceptance.py
          ./.venv/bin/pytest tests/test_crsp_ciz_mapping.py
          ./.venv/bin/pytest tests/test_ciz_execution_accounting.py
          ./.venv/bin/pytest tests/test_ciz_execution_extension.py
          ./.venv/bin/pytest tests/test_authorized_data_handoff.py
          ./.venv/bin/pytest tests/test_local_quarantine_intake.py
          ./.venv/bin/pytest tests/test_formal_backtest_readiness.py
          ./.venv/bin/pytest tests/test_restatement_firewall.py
          ./.venv/bin/pytest tests/test_formal_release_integration.py
          ./.venv/bin/pytest tests/test_risk_free_staging.py
          ./.venv/bin/pytest tests/test_provider_convergence.py
          ./.venv/bin/pytest tests/test_provider_gap_closure.py
          ./.venv/bin/pytest tests/test_provider_evidence_refresh.py
          ./.venv/bin/pytest tests/test_provider_evidence_refresh_report.py
          ./.venv/bin/pytest tests/test_risk_free_treasury_bridge.py
          ./.venv/bin/pytest tests/test_risk_free_treasury_bridge_report.py
          ./.venv/bin/pytest tests/test_survivorship_contamination.py
          ./.venv/bin/pytest tests/test_temporal_tail_robustness.py
          ./.venv/bin/pytest tests/test_baseline_multiplicity.py
          ./.venv/bin/pytest tests/test_correlation_crowding.py
          ./.venv/bin/pytest tests/test_common_risk_residual.py
          ./.venv/bin/pytest tests/test_rank_monotonicity_placebo.py
          ./.venv/bin/pytest tests/test_disclosure_known_at_protocol.py
          ./.venv/bin/pytest tests/test_disclosure_known_at.py
          ./.venv/bin/pytest tests/test_disclosure_readiness_report.py
          ./.venv/bin/pytest tests/test_multi_window_resonance.py
          ./.venv/bin/pytest tests/test_multi_window_resonance_report.py
          ./.venv/bin/pytest tests/test_qqq_replacement_overlay.py
          ./.venv/bin/pytest tests/test_calendar_capital_accounting.py
          ./.venv/bin/pytest tests/test_reversal_volatility_attribution.py
          ./.venv/bin/pytest tests/test_daily_momentum_regime.py
          ./.venv/bin/pytest tests/test_site_export.py
          ./.venv/bin/pytest tests/test_v25_live.py -k audit
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify website
        working-directory: site
        run: |
          npm ci
          npm run lint
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit genuinely advanced market or source evidence
        id: commit_update
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          paper_advanced="$(jq -r '.public_paper_status_deploy_allowed' artifacts/v25_live_refresh_status.json)"
          rf_probe_changed="false"
          guide_probe_changed="false"
          gap_source_probe_changed="false"
          if ! git diff --quiet -- \
            artifacts/short_term_risk_free_source_probe.json \
            site/data/short-term-risk-free-source-probe.json; then
            rf_probe_changed="true"
          fi
          if ! git diff --quiet -- \
            artifacts/short_term_provider_guide_probe.json \
            site/data/short-term-provider-guide-probe.json; then
            guide_probe_changed="true"
          fi
          if ! git diff --quiet -- \
            artifacts/short_term_provider_gap_source_probe.json \
            site/data/short-term-provider-gap-source-probe.json; then
            gap_source_probe_changed="true"
            guide_probe_changed="true"
          fi
          if [ "$paper_advanced" != "true" ] && [ "$rf_probe_changed" != "true" ] && [ "$guide_probe_changed" != "true" ]; then
            echo "No verified new U.S. session, official RF source change, or CRSP guide identity change; leaving published evidence unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            artifacts/short_term_risk_free_source_probe.json \
            site/data/short-term-risk-free-source-probe.json \
            artifacts/short_term_provider_guide_probe.json \
            site/data/short-term-provider-guide-probe.json \
            artifacts/short_term_provider_gap_source_probe.json \
            site/data/short-term-provider-gap-source-probe.json
          if [ "$paper_advanced" = "true" ]; then
            git add \
              artifacts/paper_v25_state.json \
              artifacts/paper_v25_spy_state.json \
              artifacts/paper_v25_matched_state.json \
              artifacts/site_data.json \
              artifacts/v25_forward_paper_evidence.json \
              artifacts/v25_live_evidence_ledger.jsonl \
              artifacts/v25_live_refresh_status.json \
              artifacts/v25_live_update_status.json \
              artifacts/v25_reference_readiness.json \
              site/data/trading-data.json
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Verified session is already recorded."
            exit 0
          fi
          data_through="$(jq -r '.data_through' artifacts/v25_live_refresh_status.json)"
          rf_cut="$(jq -r '.data_cut' artifacts/short_term_risk_free_source_probe.json)"
          guide_status="$(jq -r '.status' artifacts/short_term_provider_guide_probe.json)"
          if [ "$paper_advanced" = "true" ] && [ "$rf_probe_changed" = "true" ] && [ "$guide_probe_changed" = "true" ]; then
            commit_message="Update daily evidence through ${data_through}, RF ${rf_cut}, and guides ${guide_status}"
          elif [ "$paper_advanced" = "true" ] && [ "$rf_probe_changed" = "true" ]; then
            commit_message="Update daily evidence through ${data_through} and RF ${rf_cut}"
          elif [ "$paper_advanced" = "true" ] && [ "$guide_probe_changed" = "true" ]; then
            commit_message="Update daily evidence through ${data_through} and guides ${guide_status}"
          elif [ "$paper_advanced" = "true" ]; then
            commit_message="Update v25 Paper through ${data_through}"
          elif [ "$rf_probe_changed" = "true" ] && [ "$guide_probe_changed" = "true" ]; then
            commit_message="Update official RF ${rf_cut} and guides ${guide_status}"
          else
            if [ "$rf_probe_changed" = "true" ]; then
              commit_message="Update official RF source probe to ${rf_cut}"
            else
              commit_message="Update official CRSP guide probe to ${guide_status}"
            fi
          fi
          git commit -m "$commit_message"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy genuinely advanced evidence
        if: steps.commit_update.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

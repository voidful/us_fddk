name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/configure-pages@v6
        id: pages
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify the success-only public contract
        env:
          PYTHONHASHSEED: "0"
        run: |
          uv sync --locked --extra dev
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          ./.venv/bin/python scripts/build_public_decision_data.py
          git diff --exit-code -- \
            artifacts/public_decision_build_log.json \
            site/data/public-decision.json
          ./.venv/bin/pytest tests/test_ci_runtime_contract.py tests/test_public_decision.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and verify the static website
        working-directory: site
        env:
          PUBLIC_SITE_URL: https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run lint
          npm test
          npm run pages:test
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/pages-dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

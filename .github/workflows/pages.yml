name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        id: pages
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify frozen short-term research output
        run: |
          python -m pip install -e '.[dev]'
          python scripts/build_short_term_french_prior_return_schema_repair_report.py
          python scripts/build_short_term_french_size_prior_report.py
          python scripts/build_short_term_french_size_momentum_tilt_report.py
          git diff --exit-code -- \
            artifacts/short_term_french_prior_return_schema_repair_validation.json \
            site/data/short-term-french-prior-return-schema-repair.json \
            artifacts/short_term_french_size_prior_validation.json \
            site/data/short-term-french-size-prior.json \
            docs/SHORT_TERM_FRENCH_SIZE_PRIOR_RESEARCH_REPORT.md \
            artifacts/short_term_french_size_momentum_tilt_validation.json \
            site/data/short-term-french-size-momentum-tilt.json \
            docs/SHORT_TERM_FRENCH_SIZE_MOMENTUM_TILT_RESEARCH_REPORT.md
          pytest tests/test_french_prior_return_research.py
          pytest tests/test_french_size_prior.py
          pytest tests/test_french_size_momentum_tilt.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and verify the static website
        working-directory: site
        env:
          PUBLIC_SITE_URL: https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run lint
          npm test
          npm run pages:test
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

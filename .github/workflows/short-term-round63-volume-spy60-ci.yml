name: Short-term Round63 volume-breakout SPY-60 regime CI

on:
  pull_request:
    paths:
      - ".github/workflows/short-term-round63-volume-spy60-ci.yml"
      - "docs/SHORT_TERM_VOLUME_BREAKOUT_TOP10_SPY60_PROTOCOL.md"
      - "docs/SHORT_TERM_VOLUME_BREAKOUT_TOP10_SPY60_REPORT.md"
      - "artifacts/short_term_volume_breakout_top10_spy60_protocol_receipt.json"
      - "artifacts/short_term_volume_breakout_top10_spy60_validation.json"
      - "artifacts/short_term_global_trial_ledger_round63_extension.json"
      - "scripts/audit_short_term_volume_breakout_top10_spy60.py"
      - "tests/test_volume_breakout_top10_spy60.py"
      - "usfddk/global_trial_ledger_round63_extension.py"
      - "usfddk/short_term_volume_breakout_top10_spy60.py"
      - "usfddk/short_term_volume_breakout_top10_nonoverlap.py"
      - "tests/test_volume_breakout_top10_nonoverlap.py"
      - "tests/test_laggard_reversal_nonoverlap.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify the frozen Round63 regime-overlay diagnostic
        env:
          PYTHONHASHSEED: "0"
        run: |
          uv sync --locked --extra dev
          uv run pytest -q \
            tests/test_volume_breakout_top10_spy60.py \
            tests/test_volume_breakout_top10_nonoverlap.py \
            tests/test_laggard_reversal_nonoverlap.py
          uv run ruff check \
            usfddk/short_term_volume_breakout_top10_spy60.py \
            usfddk/global_trial_ledger_round63_extension.py \
            usfddk/short_term_volume_breakout_top10_nonoverlap.py \
            usfddk/short_term_laggard_reversal_nonoverlap.py \
            scripts/audit_short_term_volume_breakout_top10_spy60.py \
            tests/test_volume_breakout_top10_spy60.py \
            tests/test_volume_breakout_top10_nonoverlap.py \
            tests/test_laggard_reversal_nonoverlap.py
          git diff --check

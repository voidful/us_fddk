[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "us-fddk"
version = "0.1.0"
description = "可重現、先驗證後敘事的美股資料與策略研究工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "exchange-calendars>=4.7",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
us-fddk = "usfddk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["usfddk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
